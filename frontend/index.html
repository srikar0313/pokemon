<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Adventure</title>
    <link rel="stylesheet" href="style.css?v=20260912-gym-story" />
  </head>
  <body>
    <div class="app-shell">
      <div id="stats"></div>
      <div id="main-nav" class="main-nav">
        <button
          class="nav-tab active"
          data-screen="explore"
          onclick="setActiveScreen('explore')"
        >
          Explore
        </button>
        <button
          class="nav-tab"
          data-screen="party"
          onclick="setActiveScreen('party')"
        >
          Party
        </button>
        <button
          class="nav-tab"
          data-screen="inventory"
          onclick="setActiveScreen('inventory')"
        >
          Inventory
        </button>
        <button
          class="nav-tab"
          data-screen="pokedex"
          onclick="setActiveScreen('pokedex')"
        >
          Pokédex
        </button>
        <button
          class="nav-tab"
          data-screen="gym"
          onclick="setActiveScreen('gym')"
        >
          Gym
        </button>
        <button
          class="nav-tab"
          data-screen="handbook"
          onclick="openHandbook()"
        >
          Handbook
        </button>
      </div>

      <div id="screen-stack" class="screen-stack">
        <section id="explore-screen" class="screen-panel active">
          <div class="screen-card">
            <div class="screen-header">
              <div>
                <h2>Explore</h2>
                <p>Choose where to travel next.</p>
              </div>
              <div class="screen-actions">
                <button
                  class="secondary-btn"
                  onclick="openOverlay('quickPokemon')"
                >
                  Quick Pokemon
                </button>
                <button class="secondary-btn" onclick="openOverlay('center')">
                  Pokemon Center
                </button>
                <button class="secondary-btn" onclick="openOverlay('shop')">
                  Shop
                </button>
              </div>
            </div>
            <div id="areas"></div>
            <div id="area-helper" class="area-helper-text"></div>
            <div id="route-world"></div>
            <div id="npc-dialogue"></div>
          </div>
        </section>

        <section id="battle-screen" class="screen-panel">
          <div class="screen-card battle-screen-card">
            <div id="encounter"></div>
          </div>
        </section>

        <section id="party-screen" class="screen-panel">
          <div class="screen-card">
            <div class="screen-header">
              <div>
                <h2>Party</h2>
                <p>Manage your team and active Pokemon.</p>
              </div>
            </div>
            <div id="current-player"></div>
            <div id="party-panel"></div>
          </div>
        </section>

        <section id="inventory-screen" class="screen-panel">
          <div class="screen-card">
            <div class="screen-header">
              <div>
                <h2>Inventory</h2>
                <p>Use items on your active Pokemon.</p>
              </div>
              <div class="screen-actions">
                <button class="secondary-btn" onclick="openOverlay('shop')">
                  Open Shop
                </button>
              </div>
            </div>
            <div id="bag-panel"></div>
          </div>
        </section>

        <section id="pokedex-screen" class="screen-panel">
          <div class="screen-card">
            <div id="pokedex-panel"></div>
          </div>
        </section>

        <section id="gym-screen" class="screen-panel">
          <div class="screen-grid">
            <div class="screen-card">
              <div id="gyms"></div>
            </div>
            <div class="screen-card">
              <div id="elite"></div>
            </div>
          </div>
        </section>

        <section id="handbook-screen" class="screen-panel">
          <div class="screen-card handbook-screen-card">
            <div id="handbook-panel"></div>
          </div>
        </section>
      </div>

      <div
        id="overlay-backdrop"
        class="overlay-backdrop hidden"
        onclick="closeOverlay(event)"
      >
        <div class="overlay-card" onclick="event.stopPropagation()">
          <div class="overlay-header">
            <h2 id="overlay-title">Menu</h2>
            <button class="close-btn" onclick="closeOverlay()">Close</button>
          </div>
          <div id="shop-panel" class="overlay-panel hidden">
            <div id="shop"></div>
          </div>
          <div id="center-panel" class="overlay-panel hidden">
            <div class="center-panel">
              <h3>Pokemon Center</h3>
              <p>Heal your full team and storage in one visit.</p>
              <button class="primary-action" onclick="healTeam()">
                Heal All
              </button>
              <div id="center-message" class="overlay-message"></div>
            </div>
          </div>
          <div id="swap-panel" class="overlay-panel hidden">
            <div id="swap-picker"></div>
          </div>
          <div id="storage-panel" class="overlay-panel hidden">
            <div id="storage-browser"></div>
          </div>
          <div id="quick-pokemon-panel" class="overlay-panel hidden">
            <div id="quick-pokemon"></div>
          </div>
        </div>
      </div>
    </div>
    <div
      id="story-cinematic"
      class="story-cinematic hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="story-scene-title"
      onclick="advanceStoryScene()"
    >
      <div class="story-cinematic-stage">
        <div class="story-chapter-card">
          <span id="story-act-label">ACT 1</span>
          <strong id="story-scene-title">Beginning the Journey</strong>
        </div>
        <div class="story-speaker-portrait" id="story-speaker-portrait"></div>
        <div class="story-dialogue-panel" onclick="event.stopPropagation()">
          <div class="story-dialogue-head">
            <div>
              <span id="story-scene-name">Story Event</span>
              <strong id="story-speaker-name">Story</strong>
            </div>
            <button class="story-skip-button" onclick="skipStoryScene()">Skip scene</button>
          </div>
          <p id="story-dialogue-text" aria-live="polite"></p>
          <div class="story-dialogue-footer">
            <span id="story-line-progress">1 / 1</span>
            <button class="story-continue-button" onclick="advanceStoryScene()">
              Continue <span aria-hidden="true">▼</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <aside
      id="presentation-settings-panel"
      class="presentation-settings-panel hidden"
      aria-label="Battle audio and motion settings"
    >
      <div class="presentation-settings-head">
        <strong>Battle Settings</strong>
        <button
          class="battle-bag-close"
          onclick="window.BattlePresentation?.toggleSettings()"
          aria-label="Close battle settings"
        >&times;</button>
      </div>
      <label>
        <span>Music</span>
        <input id="music-volume" type="range" min="0" max="100" step="1" />
      </label>
      <label>
        <span>SFX</span>
        <input id="sfx-volume" type="range" min="0" max="100" step="1" />
      </label>
      <label>
        <span>Cries</span>
        <input id="cry-volume" type="range" min="0" max="100" step="1" />
      </label>
      <label class="presentation-toggle-row">
        <span>Mute</span>
        <input id="audio-muted" type="checkbox" />
      </label>
      <label class="presentation-toggle-row">
        <span>Reduce battle motion</span>
        <input id="reduce-battle-motion" type="checkbox" />
      </label>
    </aside>
    <script type="module" src="js/battlePresentationBootstrap.mjs?v=20260912-gym-story"></script>
    <script src="variantUtils.js?v=20260906-variants"></script>
    <script src="script.js?v=20260912-gym-story"></script>
  </body>
</html>
